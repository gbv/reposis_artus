mir.help.publisher                                                             = Nom complet de la maison d\u2018\u00e9dition (par exemple, \u00ab McFarland \u00bb). Lorsque vous abr\u00e9gez le nom d\u0027une maison d\u2018\u00e9dition, utilisez \u00ab Univ. \u00bb pour \u00ab Universit\u00e9 \u00bb ou \u00ab Universitaire(s) \u00bb, mais n\u0027abr\u00e9gez pas \u00ab Presse \u00bb ou \u00ab Presses \u00bb en \u00ab Pr. \u00bb, par exemple \u00ab Cambridge Univ. Press \u00bb ou \u00ab Presses Univ. de France \u00bb. Les informations de d\u00e9tail relatives \u00e0 la soci\u00e9t\u00e9 et les mentions compl\u00e9mentaires telles que \u00ab \u0026 Company, Inc. Publishers \u00bb ne sont pas requises. Le mot allemand \u00ab Verlag \u00bb, le mot fran\u00e7ais \u201e\u00e9dition\u201c ne sont pas obligatoires (utiliser \u00ab Erich Schmidt \u00bb au lieu de \u00ab Erich Schmidt Verlag \u00bb).
